<!DOCTYPE html>
<html>
<head>
    <title>Face Arena Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>FACE ARENA REGISTRATION</h1>

    <form>
        <input type="text" placeholder="Full Name" required><br><br>

        <input type="text" placeholder="Stage Name" required><br><br>

        <input type="tel" placeholder="Phone Number" required><br><br>

        <select required>
            <option value="">Select Talent</option>
            <option>Singing</option>
            <option>Dancing</option>
            <option>Comedy</option>
            <option>Acting</option>
        </select><br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
