<!DOCTYPE html>
<html>
<head>
  <title>Face Arena Registration</title>
</head>

<body>
  <h2>FACE ARENA – Registration Form</h2>

  <form id="contestForm">

    <input type="text" id="fullName" placeholder="Full Name" required><br><br>

    <input type="text" id="stageName" placeholder="Stage Name" required><br><br>

    <select id="gender" required>
      <option value="">Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select><br><br>

    <input type="text" id="state" placeholder="State" required><br><br>

    <input type="text" id="school" placeholder="University / School" required><br><br>

    <button type="submit">Submit Entry</button>
  </form>

  <p id="msg"></p>

  <script type="module" src="script.js"></script>
</body>
</html>
