<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Arena Registration Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>FACE ARENA</h1>
  <p>Discover • Showcase • Celebrate Talent</p>
</header>

<section class="hero">
  <h2>Join Face Arena Today</h2>
  <p>Show the world your talent and get discovered.</p>
</section>

<section class="form-container">

<form id="registrationForm">

<h3>Personal Information</h3>

<input type="text" id="fullname" placeholder="Full Name" required>

<input type="text" id="stageName" placeholder="Stage Name" required>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<input type="text" id="state" placeholder="State of Origin" required>

<input type="text" id="location" placeholder="Current Location" required>

<h3>Contact Information</h3>

<input type="tel" id="phone" placeholder="Phone Number" required>

<input type="tel" id="whatsapp" placeholder="WhatsApp Number" required>

<h3>Academic Information</h3>

<input type="text" id="school" placeholder="University / School" required>

<input type="text" id="department" placeholder="Department" required>

<h3>Talent Information</h3>

<select id="talent" required>
<option value="">Talent Category</option>
<option>Singing</option>
<option>Dancing</option>
<option>Comedy</option>
<option>MC</option>
<option>Acting</option>
<option>Modeling</option>
<option>Instrumentalist</option>
</select>

<textarea
id="bio"
placeholder="Short Bio About Your Talent"
required>
</textarea>

<h3>Profile Photo</h3>

<input
type="file"
id="photo"
accept="image/*"
required>

<button type="submit">
Submit Registration
</button>

</form>

</section>

<script src="app.js"></script>

</body>
</html>
